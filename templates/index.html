<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura — Smart Reception</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  <!-- Screensaver Overlay -->
  <div id="screensaver" class="hidden">
    <video id="screensaver-video" src="{{ url_for('static', filename='YTDown_YouTube_Why-Sunway-College_Media_w0scmm9CCsU_001_1080p.mp4') }}" loop playsinline></video>
    <div id="screensaver-hint">Tap anywhere to return</div>
  </div>

  <!-- Listening Overlay -->
  <div id="listening-overlay" class="hidden">
    <div class="orb-wrap">
      <div id="orb" class="orb">
        <div class="orb-core"></div>
      </div>
    </div>
    <p id="listening-label" class="listening-label">Listening</p>
    <div class="listening-bars">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
  </div>

  <!-- Chat Page -->
  <div class="page">

    <!-- Header -->
    <div class="header">
      <div class="header-brand">
        <div class="brand-orb">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a10 10 0 0 1 10 10c0 5.52-4.48 10-10 10S2 17.52 2 12 6.48 2 12 2z"/>
            <path d="M12 8v4l3 3"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">Aura Reception</div>
          <div class="brand-sub">Sunway College Kathmandu · AI Assistant</div>
        </div>
      </div>
      <button id="clear-btn" class="clear-btn hidden">Clear Chat</button>
    </div>

    <!-- Messages -->
    <div id="messages" class="messages">
      <div id="empty-state" class="empty-state">
        <div class="empty-orb">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#C61F3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
        </div>
        <p class="empty-title">Hi, I'm Aura</p>
        <p class="empty-sub">Ask me anything about Sunway College — admissions, courses, campus, events and more.</p>
      </div>
    </div>

    <!-- Input bar -->
    <div class="input-wrap">
      <div class="input-bar" id="input-bar">
        <input type="text" id="user-input" placeholder="Message Aura..." autocomplete="off" />
        <div class="input-actions">
          <button id="mic-btn" class="action-btn" title="Speak">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
          </button>
          <button id="send-btn" class="action-btn send-btn-active" title="Send">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"/>
              <polyline points="5 12 12 5 19 12"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

  </div>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
